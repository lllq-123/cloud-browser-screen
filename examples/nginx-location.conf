# 放进你已经在用的 HTTPS 站点里：有 `listen 443 ssl` 的那个 server { ... }。
# 手机网页、接口、实时画面（WebSocket）都在 /vscreen/ 下面，一段就够。
# 改了 VSCREEN_PORT 或 VSCREEN_PATH 的话，这里的端口和路径跟着改。
# `^~` 别删：站点里要是有「js、css、图片走缓存」这类正则规则（宝塔面板建的站默认就有），
# 没有它的话，手机网页的 js 和 css 会被那些规则接走，打开是一张白页。

location ^~ /vscreen/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 实时画面走 WebSocket，要把「升级」请求原样转过去
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
